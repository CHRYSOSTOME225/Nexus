<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXUS - Connexion</title>

    <link rel="stylesheet" href="connexion.css">
</head>

<body>

    <!-- Arrière-plan animé -->

    <div class="fond">

        <span class="orb orb1"></span>
        <span class="orb orb2"></span>
        <span class="orb orb3"></span>

    </div>


    <!-- PAGE DE CONNEXION -->

    <main class="login-page">

        <div class="login-card">

            <div class="logo">
                NEXUS
            </div>

            <p class="welcome">
                BIENVENUE
            </p>

            <h1>
                Bon retour.
            </h1>

            <p class="description">
                Connectez-vous à votre espace NEXUS.
            </p>


            <form id="loginForm">

                <!-- Email -->

                <div class="champ">

                    <label for="email">
                        Adresse email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="exemple@email.com"
                        required
                    >

                </div>


                <!-- Mot de passe -->

                <div class="champ">

                    <label for="password">
                        Mot de passe
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="••••••••"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <span>
                            Se souvenir de moi
                        </span>

                    </label>

                    <a href="#">
                        Mot de passe oublié ?
                    </a>

                </div>


                <button
                    type="submit"
                    class="btn-connexion"
                >
                    Se connecter
                </button>


                <p
                    id="message"
                    class="message"
                ></p>

            </form>


            <p class="inscription">

                Pas encore de compte ?

                <a href="#">
                    Créer un compte
                </a>

            </p>

        </div>

    </main>


    <script src="connexion.js"></script>

</body>

</html>
